<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/ui/logo.png" />
    <title>NTE Telemetry</title>
    <meta
      name="description"
      content="NTE Telemetry - live car telemetry, online race timing and race replays for Neverness to Everness. Free download for Windows."
    />
    <!-- The loading animation, shown from the very first moment and removed by
         src/PageGate.jsx once the page has loaded (it sits outside #root, so React's
         first render doesn't restart it). -->
    <style>
      body {
        margin: 0;
        background: #000;
      }
      .boot-loader {
        position: fixed;
        z-index: 100;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-loader-ripple {
        position: relative;
        width: 80px;
        height: 80px;
      }
      .boot-loader-ripple span {
        position: absolute;
        border: 4px solid #fbcf4d;
        border-radius: 50%;
        animation: boot-ripple 1s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      .boot-loader-ripple span:nth-child(2) {
        animation-delay: -0.5s;
      }
      @keyframes boot-ripple {
        0%,
        4.9% {
          inset: calc(50% - 4px);
          opacity: 0;
        }
        5% {
          inset: calc(50% - 4px);
          opacity: 1;
        }
        100% {
          inset: 0;
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" class="boot-loader" role="status" aria-label="Loading">
      <div class="boot-loader-ripple"><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
