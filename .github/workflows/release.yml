# Publishes a release when the app's version changes: change VERSION in src/version.py and push to main. The
# installer of that version is built (build_msi.py) and published as GitHub release v<VERSION>. A version that
# already has its release (tag v<VERSION>) is left alone, so a push that doesn't raise it publishes nothing.
name: Release

on:
  push:
    branches:
      - main
    paths:
      - src/version.py
  workflow_dispatch:  # by hand, from the Actions tab: e.g. again after a failed build

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read the version and look for its release
        id: check
        shell: bash
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"\s*$/\1/p' src/version.py)
          echo "Version: $version"
          if ! [[ "$version" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,5}$ ]]; then
            echo "::error file=src/version.py::VERSION must look like 1.2.3, not '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released: nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 7.0.0
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Set up WiX
        run: |
          wix eula accept wix7
          wix extension add -g WixToolset.UI.wixext/7.0.0

      - name: Build the installer
        run: python build_msi.py $env:VERSION

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: NTE Telemetry v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/NTE Telemetry-${{ env.VERSION }}.msi
          fail_on_unmatched_files: true
